<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C# Form Stüdyosu</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/icon.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/img/icon-512.png">
  <link rel="apple-touch-icon" href="assets/img/icon-180.png">
  <meta name="theme-color" content="#ff7a0a">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/winforms.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <script>
    // tema, sayfa çizilmeden önce (açık renk yanıp sönmesin)
    try { var t = localStorage.getItem('csfs-theme'); if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <div class="boot">
      <img class="boot-logo" src="assets/img/icon.svg" alt="">
      <div class="boot-text">Yükleniyor…</div>
    </div>
  </div>
  <noscript>Bu uygulama için JavaScript gereklidir.</noscript>
  <!-- sql.js (MySQL simülatörü) Monaco'nun AMD yükleyicisinden önce yüklenmeli -->
  <script src="lib/sqljs/sql-wasm.js"></script>
  <script src="lib/monaco/vs/loader.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
